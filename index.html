```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL Lesson: Clothes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            gap: 0;
        }

        .tab-button {
            flex: 1;
            min-width: 150px;
            padding: 15px 20px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #333;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-button:hover {
            background: #e8e8e8;
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 40px 30px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1.8em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        h3 {
            color: #764ba2;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .vocab-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .vocab-term {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .arabic-trans {
            font-size: 1.1em;
            color: #764ba2;
            font-weight: 600;
            margin-left: 10px;
        }

        .vocab-definition {
            font-size: 1em;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .vocab-examples {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .vocab-examples ul {
            list-style-position: inside;
            color: #666;
        }

        .vocab-examples li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .expression-item {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 5px solid #ff6b6b;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .expression-phrase {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .expression-context {
            font-size: 0.95em;
            color: #555;
            margin-bottom: 10px;
            font-style: italic;
        }

        .dialogue-box {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 5px solid #4facfe;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dialogue-line {
            margin-bottom: 10px;
            line-height: 1.6;
            color: #333;
        }

        .dialogue-line strong {
            color: #4facfe;
        }

        .mistake-item {
            background: linear-gradient(135deg, #ffa502 0%, #ffb84d 100%);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 5px solid #ff6348;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .wrong {
            text-decoration: line-through;
            color: #c0392b;
            font-weight: bold;
        }

        .right {
            color: #27ae60;
            font-weight: bold;
        }

        .mistake-explanation {
            margin-top: 10px;
            color: #333;
            line-height: 1.6;
        }

        .exercise-block {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .exercise-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .fill-blank-item {
            background: white;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            line-height: 1.6;
        }

        .fill-blank-input {
            border: 2px solid #667eea;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 0 5px;
            font-size: 0.95em;
            width: 150px;
        }

        .clue {
            background: #fff3cd;
            padding: 2px 8px;
            border-radius: 4px;
            color: #856404;
            font-weight: 600;
            margin-left: 10px;
            font-size: 0.9em;
        }

        .dropdown-match {
            background: white;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .dropdown-match select {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            background: white;
        }

        .paragraph-item {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            line-height: 1.8;
        }

        .paragraph-input {
            border: 2px solid #667eea;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 0 5px;
            font-size: 0.95em;
            width: 120px;
        }

        .btn-check {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-top: 15px;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-check:active {
            transform: translateY(0);
        }

        .btn-show {
            background: #27ae60;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-show:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(39, 174, 96, 0.4);
        }

        .btn-show:active {
            transform: translateY(0);
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .answer-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            border-left: 4px solid #27ae60;
            color: #333;
            line-height: 1.6;
        }

        .visual-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .visual-card svg {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px;
        }

        .visual-question {
            font-size: 1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .visual-textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.95em;
            margin-bottom: 10px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .sentence-pattern {
            background: #fff3cd;
            padding: 8px 12px;
            border-radius: 6px;
            color: #856404;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.9em;
        }

        .open-question {
            background: linear-gradient(135deg, #d4a5ff 0%, #a8b3ff 100%);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .open-question-text {
            font-size: 1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .open-textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.95em;
            margin-bottom: 10px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .story-box {
            background: linear-gradient(135deg, #fff5e1 0%, #ffe0b2 100%);
            padding: 25px;
            border-radius: 10px;
            border-left: 5px solid #ff9800;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            line-height: 1.8;
            color: #333;
        }

        .story-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 15px;
        }

        .story-text {
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .tab-button {
                min-width: 120px;
                padding: 12px 10px;
                font-size: 0.85em;
            }

            .tab-content {
                padding: 25px 15px;
            }

            .fill-blank-input,
            .paragraph-input {
                width: 100%;
                margin: 5px 0;
            }

            .dropdown-match {
                flex-direction: column;
                align-items: flex-start;
            }

            .visual-card {
                margin-bottom: 20px;
            }

            h2 {
                font-size: 1.4em;
            }

            h3 {
                font-size: 1.1em;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 10px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 1.4em;
            }

            .tab-nav {
                gap: 0;
            }

            .tab-button {
                min-width: 90px;
                padding: 10px 8px;
                font-size: 0.75em;
            }

            .tab-content {
                padding: 20px 12px;
            }

            .vocab-item,
            .expression-item,
            .dialogue-box,
            .mistake-item,
            .exercise-block {
                padding: 15px;
                margin-bottom: 15px;
            }

            .btn-check,
            .btn-show {
                padding: 8px 15px;
                font-size: 0.85em;
                width: 100%;
                margin-bottom: 5px;
            }
        }
